<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gradTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4ad"/>
      <stop offset="100%" stop-color="#008d88"/>
    </linearGradient>
    <linearGradient id="gradEmber" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="#0a0e14"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#1f2937" stroke-width="6"/>

  <!-- Barbell Plates & Shaft -->
  <!-- Left Weight Plates -->
  <rect x="88" y="160" width="28" height="192" rx="10" fill="url(#gradEmber)"/>
  <rect x="126" y="184" width="22" height="144" rx="8" fill="#cbd5e1"/>
  <rect x="156" y="212" width="16" height="88" rx="6" fill="#64748b"/>

  <!-- Center Bar -->
  <rect x="160" y="244" width="192" height="24" rx="6" fill="#e2e8f0" filter="url(#glow)"/>
  <!-- Knurling texture highlights -->
  <line x1="220" y1="244" x2="220" y2="268" stroke="#008d88" stroke-width="4"/>
  <line x1="256" y1="244" x2="256" y2="268" stroke="#008d88" stroke-width="4"/>
  <line x1="292" y1="244" x2="292" y2="268" stroke="#008d88" stroke-width="4"/>

  <!-- Right Weight Plates -->
  <rect x="340" y="212" width="16" height="88" rx="6" fill="#64748b"/>
  <rect x="364" y="184" width="22" height="144" rx="8" fill="#cbd5e1"/>
  <rect x="396" y="160" width="28" height="192" rx="10" fill="url(#gradEmber)"/>

  <!-- Emblem Monogram "W" Crown -->
  <path d="M196 348 L226 424 L256 368 L286 424 L316 348" fill="none" stroke="url(#gradTeal)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top Star Accent -->
  <polygon points="256,92 265,116 290,116 270,131 278,155 256,140 234,155 242,131 222,116 247,116" fill="url(#gradEmber)"/>
</svg>
